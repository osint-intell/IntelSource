name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check syntax
        run: |
          python -m py_compile main.py
          python -m py_compile collectors/whois_collector.py collectors/dns_collector.py collectors/geoip_collector.py collectors/email_validator.py
          python -m py_compile utils/validators.py utils/logger.py utils/output.py

      - name: Test imports
        run: |
          python -c "import collectors.geoip_collector; import collectors.dns_collector; import collectors.whois_collector; import collectors.email_validator"
          python -c "import utils.validators; import utils.logger; import utils.output"

      - name: Verify requirements match installed packages
        run: |
          pip list
          pip check

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety

      - name: Run safety check for known vulnerabilities
        run: safety check --json || true
